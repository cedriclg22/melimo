<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Créer un tableau — Melimo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="topbar">
    <a class="logo" href="index.html">Melimo</a>
    <button class="btn ghost" id="demoFillBtn" type="button">Pré-remplir une démo</button>
  </div>

  <div class="wrap">
    <p class="hint" style="text-align:center;">Clique directement sur le tableau pour le modifier : photos, mots, rébus, couleurs…</p>

    <div id="editablePoster"></div>

    <div id="shareWrap" style="margin-top:30px; display:none;">
      <div class="share-box">
        <h2>Ton tableau est prêt 🎉</h2>
        <p>Partage ce lien avec la personne à qui il est destiné, ou récupère l'affiche à imprimer :</p>
        <input type="text" id="shareLink" readonly>
        <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:10px;">
          <a class="btn" id="openViewBtn" href="#" target="_blank">Ouvrir le tableau</a>
          <a class="btn ghost" id="openPosterBtn" href="#" target="_blank">🖨️ Voir l'affiche à imprimer</a>
        </div>
      </div>
    </div>
  </div>

  <div class="floating-generate">
    <button class="btn" id="generateBtn" type="button">✨ Générer le tableau</button>
  </div>

  <script src="app.js"></script>
  <script src="create.js"></script>
</body>
</html>
